services:
  trade-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade-api
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      - DB_TYPE=postgresql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=trade
      - DB_USER=chaba
      - DATA_QUALITY_ENABLED=true
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - web_default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  trade-automation:
    image: trade-trade-api
    container_name: trade-automation
    env_file:
      - .env
    environment:
      - DB_TYPE=postgresql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=trade
      - DB_USER=chaba
      - DATA_QUALITY_ENABLED=true
      - AUTOMATION_ENABLED=true
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    command: ["python", "scripts/auto_update.py", "--scheduled"]
    networks:
      - web_default
    depends_on:
      - trade-api
    restart: unless-stopped
    healthcheck:
      disable: true

networks:
  web_default:
    external: true
