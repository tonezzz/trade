services:
  trade-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade-api
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      - DB_TYPE=postgresql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=trade
      - DB_USER=chaba
      - DATA_QUALITY_ENABLED=true
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - web_default
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER:-chaba}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-chabapass}
      - POSTGRES_DB=${DB_NAME:-trade}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web_default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-chaba} -d ${DB_NAME:-trade}"]
      interval: 10s
      timeout: 5s
      retries: 5

  trade-automation:
    image: trade-trade-api
    container_name: trade-automation
    env_file:
      - .env
    environment:
      - DB_TYPE=postgresql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=trade
      - DB_USER=chaba
      - DATA_QUALITY_ENABLED=true
      - AUTOMATION_ENABLED=true
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    command: ["python", "scripts/auto_update.py", "--scheduled"]
    networks:
      - web_default
    depends_on:
      - trade-api
    restart: unless-stopped
    healthcheck:
      disable: true

networks:
  web_default:
    external: true

volumes:
  postgres_data:
    external: true
