version: '3.8'

services:
  trade-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trade-api
    ports:
      - "9000:9000"
    environment:
      - DB_TYPE=sqlite
      - DB_NAME=/app/data/dollar_prices.db
      - DATA_QUALITY_ENABLED=true
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-KUTH6I3J1OORWZI8}
      - FRED_API_KEY=${FRED_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - trade-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # trade-automation: DISABLED - using manual workflow instead
