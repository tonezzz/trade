<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Strategy Recommendations</title>
    <link rel='icon' type='image/svg+xml' href='favicon.svg'>
    <link rel='stylesheet' href='styles.css'>
    <script src='strategies.js'></script>
</head>
<body>
    <div class='container'>
        <nav class='nav-menu'>
            <ul class='nav-list'>
                <li class='nav-item'><a href='index.html' class='nav-link'>TradeCanvas</a></li>
                <li class='nav-item'><a href='compare.html' class='nav-link'>Compare</a></li>
                <li class='nav-item'><a href='compare2.html' class='nav-link'>Compare2</a></li>
                <li class='nav-item'><a href='banpu-ptt-sma.html' class='nav-link'>BANPU+PTT</a></li>
                <li class='nav-item'><a href='thb-atr.html' class='nav-link'>THB ATR</a></li>
                <li class='nav-item'><a href='strategy-recommendations.html' class='nav-link active'>Strategy Recs</a></li>
                <li class='nav-item'><a href='/apps/gold/conclusion.html' class='nav-link'>Gold/THB Research</a></li>
            </ul>
        </nav>

        <header class='header'>
            <h1>Strategy Recommendations</h1>
            <div class='header-controls'>
                <span id='status' class='status disconnected'>Ready</span>
            </div>
        </header>

        <div class='main-content'>
            <div class='chart-section'>
                <div class='chart-header'>
                    <h2 id='page-title'>Test strategy against all available symbols</h2>
                </div>

                <div class='chart-controls' style='flex-wrap: wrap; gap: 1rem; align-items: center;'>
                    <div class='control-group'>
                        <label for='strategy-select'>Strategy:</label>
                        <select id='strategy-select' class='btn'>
                            <option value='sma_crossover'>SMA Crossover</option>
                            <option value='ema_crossover'>EMA Crossover</option>
                            <option value='rsi_reversal'>RSI Reversal</option>
                            <option value='macd_crossover'>MACD Crossover</option>
                            <option value='bollinger_reversion'>Bollinger Reversion</option>
                            <option value='manual_perfect'>Manual Perfect</option>
                        </select>
                    </div>

                    <div class='control-group'>
                        <label for='timeframe-select'>Timeframe:</label>
                        <select id='timeframe-select' class='btn'>
                            <option value='1y' selected>1 Year</option>
                            <option value='6m'>6 Months</option>
                            <option value='3m'>3 Months</option>
                            <option value='1m'>1 Month</option>
                            <option value='5y'>5 Years</option>
                            <option value='all'>All</option>
                        </select>
                    </div>

                    <div id='parameters-container' class='control-group' style='display: flex; gap: 0.5rem; flex-wrap: wrap;'>
                    </div>

                    <button id='run-btn' class='btn'>Run Strategy</button>
                </div>

                <div id='summary' style='margin: 1rem 0; display: flex; gap: 1rem; flex-wrap: wrap;'></div>

                <div class='table-wrapper' style='overflow-x: auto; margin-top: 1rem;'>
                    <table class='data-table' id='results-table'>
                        <thead>
                            <tr>
                                <th>Symbol</th>
                                <th>Type</th>
                                <th>Latest (THB)</th>
                                <th>Records</th>
                                <th>Chart</th>
                                <th>Last Signal</th>
                                <th>Recommendation</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id='results-body'></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_PREFIX = '/apps/trade/api';

        const STRATEGY_DEFAULTS = {
            sma_crossover: { short_period: 20, long_period: 50 },
            ema_crossover: { short_period: 12, long_period: 26 },
            rsi_reversal: { period: 14, oversold: 30, overbought: 70 },
            macd_crossover: { fast: 12, slow: 26, signal: 9 },
            bollinger_reversion: { period: 20, std_dev: 2.0 },
            manual_perfect: { auto_detect: true }
        };

        const PARAM_LABELS = {
            short_period: 'Short Period',
            long_period: 'Long Period',
            period: 'Period',
            oversold: 'Oversold',
            overbought: 'Overbought',
            fast: 'Fast',
            slow: 'Slow',
            signal: 'Signal',
            std_dev: 'Std Dev',
            auto_detect: 'Auto Detect'
        };

        function renderParameters() {
            const strategy = document.getElementById('strategy-select').value;
            const container = document.getElementById('parameters-container');
            container.innerHTML = '';

            const defaults = STRATEGY_DEFAULTS[strategy];
            for (const [key, value] of Object.entries(defaults)) {
                const label = document.createElement('label');
                label.style.display = 'inline-flex';
                label.style.alignItems = 'center';
                label.style.gap = '0.25rem';
                label.style.color = '#e0e0e0';

                if (typeof value === 'boolean') {
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = value;
                    checkbox.dataset.param = key;
                    label.appendChild(checkbox);
                    label.appendChild(document.createTextNode(PARAM_LABELS[key] || key));
                } else {
                    label.textContent = (PARAM_LABELS[key] || key) + ':';
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.value = value;
                    input.dataset.param = key;
                    input.style.width = '4rem';
                    input.style.padding = '0.25rem';
                    label.appendChild(input);
                }
                container.appendChild(label);
            }
        }

        function readParameters() {
            const strategy = document.getElementById('strategy-select').value;
            const result = {};
            const container = document.getElementById('parameters-container');

            for (const el of container.querySelectorAll('[data-param]')) {
                const key = el.dataset.param;
                if (el.type === 'checkbox') {
                    result[key] = el.checked;
                } else {
                    const num = parseFloat(el.value);
                    result[key] = isNaN(num) ? STRATEGY_DEFAULTS[strategy][key] : num;
                }
            }
            return result;
        }

        function formatDate(timestamp) {
            try {
                return new Date(timestamp * 1000).toISOString().split('T')[0];
            } catch {
                return '-';
            }
        }

        function getRecommendation(signal) {
            if (signal.buy) return 'BUY';
            if (signal.sell) return 'SELL';
            return 'HOLD';
        }

        function buildDetails(strategy, indicators, lastIndex, thbClose) {
            const mult = (v) => v == null ? null : (thbClose && thbClose !== 1 ? v * thbClose : v);
            if (strategy === 'sma_crossover' || strategy === 'ema_crossover') {
                const s = mult(indicators.short[lastIndex]);
                const l = mult(indicators.long[lastIndex]);
                if (s != null && l != null) {
                    return `Short: ${s.toFixed(4)}  Long: ${l.toFixed(4)}`;
                }
            } else if (strategy === 'rsi_reversal') {
                const r = indicators.rsi[lastIndex];
                if (r != null) return `RSI: ${r.toFixed(2)}`;
            } else if (strategy === 'macd_crossover') {
                const m = mult(indicators.macd[lastIndex]);
                const s = mult(indicators.signal[lastIndex]);
                if (m != null && s != null) return `MACD: ${m.toFixed(4)}  Signal: ${s.toFixed(4)}`;
            } else if (strategy === 'bollinger_reversion') {
                const u = mult(indicators.upper[lastIndex]);
                const l = mult(indicators.lower[lastIndex]);
                const m = mult(indicators.middle[lastIndex]);
                if (u != null && l != null) {
                    return `Upper: ${u.toFixed(4)}  Middle: ${(m || 0).toFixed(4)}  Lower: ${l.toFixed(4)}`;
                }
            } else if (strategy === 'manual_perfect') {
                return `Buy points: ${indicators.buyPoints.length}  Sell points: ${indicators.sellPoints.length}`;
            }
            return '';
        }

        function createSvgSparkline(values, width, height) {
            const w = width || 160;
            const h = height || 40;
            const valid = [];
            for (let i = 0; i < values.length; i++) {
                if (values[i] != null) valid.push({ v: values[i], i });
            }
            if (valid.length < 2) return '-';
            const nums = valid.map(p => p.v);
            const min = Math.min(...nums);
            const max = Math.max(...nums);
            const range = max - min || 1;
            const points = valid.map(p => {
                const x = values.length === 1 ? 0 : (p.i / (values.length - 1)) * w;
                const y = h - ((p.v - min) / range) * h;
                return `${x.toFixed(2)},${y.toFixed(2)}`;
            }).join(' ');
            const end = valid[valid.length - 1].v;
            const start = valid[0].v;
            const color = end >= start ? '#3fb950' : '#f85149';
            const lastX = w;
            const lastY = h - ((end - min) / range) * h;
            return `<svg width='${w}' height='${h}' viewBox='0 0 ${w} ${h}' style='overflow: visible; vertical-align: middle;'>` +
                `<polyline points='${points}' fill='none' stroke='${color}' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>` +
                `<circle cx='${lastX}' cy='${lastY}' r='3' fill='${color}'/>` +
                `</svg>`;
        }

        async function fetchThbData(timeframe) {
            const res = await fetch(`${API_PREFIX}/ui/chart-data/THB?timeframe=${timeframe}`);
            if (!res.ok) throw new Error('THB base data not available: ' + res.status);
            const json = await res.json();
            const data = (json.data || []).slice().sort((a, b) => a.time - b.time);
            const map = {};
            let latest = 1;
            for (const p of data) {
                map[p.time] = p.close;
                latest = p.close;
            }
            return { data, map, latest };
        }

        async function fetchAvailable() {
            const [currenciesRes, commoditiesRes] = await Promise.all([
                fetch(`${API_PREFIX}/available/currencies`),
                fetch(`${API_PREFIX}/available/commodities`)
            ]);

            const currencies = currenciesRes.ok ? (await currenciesRes.json()).items || [] : [];
            const commodities = commoditiesRes.ok ? (await commoditiesRes.json()).items || [] : [];

            return [
                ...currencies.map(s => ({ symbol: s, type: 'Currency' })),
                ...commodities.map(s => ({ symbol: s, type: 'Commodity' }))
            ];
        }

        async function evaluateSymbol(symbol, type, strategy, parameters, timeframe, thbMap, thbLatest, thbPreloaded) {
            let data;
            if (thbPreloaded) {
                data = thbPreloaded.slice();
            } else {
                const res = await fetch(`${API_PREFIX}/ui/chart-data/${encodeURIComponent(symbol)}?timeframe=${timeframe}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const json = await res.json();
                data = (json.data || []).slice();
                if (data.length === 0) throw new Error('No data');
            }

            data.sort((a, b) => a.time - b.time);

            const isThb = symbol.toUpperCase() === 'THB';
            const thbValues = new Array(data.length);
            for (let i = 0; i < data.length; i++) {
                const thbClose = isThb ? 1 : (thbMap[data[i].time] ?? thbLatest);
                thbValues[i] = data[i].close * thbClose;
            }

            const strat = StrategyFactory.create(strategy, parameters);
            if (typeof strat.setData === 'function') {
                strat.setData(data);
            }
            const indicators = strat.calculateIndicators(data);

            let lastSignal = null;
            let lastSignalDate = null;
            let lastSignalType = null;

            for (let i = 0; i < data.length; i++) {
                const sig = strat.getSignal(i, indicators);
                if (sig.buy || sig.sell) {
                    lastSignal = i;
                    lastSignalDate = data[i].time;
                    lastSignalType = sig.buy ? 'BUY' : 'SELL';
                }
            }

            const lastIndex = data.length - 1;
            const currentSignal = strat.getSignal(lastIndex, indicators);
            const recommendation = getRecommendation(currentSignal);
            const last = data[lastIndex];
            const thbCloseLast = isThb ? 1 : (thbMap[last.time] ?? thbLatest);
            const latestCloseTHB = thbValues[lastIndex];

            return {
                symbol,
                type,
                latestClose: last.close,
                latestCloseTHB,
                records: data.length,
                thbValues,
                lastSignalIndex: lastSignal,
                lastSignalDate,
                lastSignalType,
                recommendation,
                details: buildDetails(strategy, indicators, lastIndex, thbCloseLast),
                error: null
            };
        }

        function renderSummary(results, thbLatest) {
            const summary = document.getElementById('summary');
            const buy = results.filter(r => r.recommendation === 'BUY').length;
            const sell = results.filter(r => r.recommendation === 'SELL').length;
            const hold = results.filter(r => r.recommendation === 'HOLD').length;
            const error = results.filter(r => r.error).length;

            summary.innerHTML = `
                <span class='status' style='background:#1a2f23; color:#3fb950;'>BUY: ${buy}</span>
                <span class='status' style='background:#2f1a1a; color:#f85149;'>SELL: ${sell}</span>
                <span class='status' style='background:#30363d; color:#e6edf3;'>HOLD: ${hold}</span>
                ${error ? `<span class='status' style='background:#2f1a1a; color:#f85149;'>Errors: ${error}</span>` : ''}
                <span class='status' style='background:#1a1a2e; color:#e0e0e0;'>THB base: 1 USD = ${thbLatest != null ? thbLatest.toFixed(2) : '?'} THB</span>
            `;
        }

        function renderResults(results, thbLatest) {
            const tbody = document.getElementById('results-body');
            tbody.innerHTML = '';

            const sorted = [...results].sort((a, b) => {
                const order = { BUY: 0, SELL: 1, HOLD: 2 };
                return (order[a.recommendation] ?? 3) - (order[b.recommendation] ?? 3);
            });

            for (const r of sorted) {
                const tr = document.createElement('tr');
                if (r.error) {
                    tr.innerHTML = `
                        <td><strong>${r.symbol}</strong></td>
                        <td>${r.type}</td>
                        <td colspan='6' style='color:#f85149;'>Error: ${r.error}</td>
                    `;
                } else {
                    const recClass = r.recommendation === 'BUY' ? 'buy' : r.recommendation === 'SELL' ? 'sell' : 'hold';
                    const lastSignalText = r.lastSignalDate
                        ? `${r.lastSignalType} at ${formatDate(r.lastSignalDate)}`
                        : 'None';
                    tr.innerHTML = `
                        <td><strong>${r.symbol}</strong></td>
                        <td>${r.type}</td>
                        <td>${r.latestCloseTHB != null ? r.latestCloseTHB.toFixed(2) : '-'}</td>
                        <td>${r.records}</td>
                        <td class='sparkline'>${createSvgSparkline(r.thbValues)}</td>
                        <td>${lastSignalText}</td>
                        <td><span class='rec-badge ${recClass}'>${r.recommendation}</span></td>
                        <td style='font-size: 0.85rem; color: #b0b0b0;'>${r.details}</td>
                    `;
                }
                tbody.appendChild(tr);
            }

            renderSummary(results, thbLatest);
        }

        async function run() {
            const status = document.getElementById('status');
            const btn = document.getElementById('run-btn');
            const strategy = document.getElementById('strategy-select').value;
            const timeframe = document.getElementById('timeframe-select').value;
            const parameters = readParameters();

            status.textContent = 'Loading THB base...';
            status.className = 'status disconnected';
            btn.disabled = true;

            try {
                const thb = await fetchThbData(timeframe);
                const thbPreloaded = thb.data;

                status.textContent = 'Loading symbols...';
                const symbols = await fetchAvailable();
                if (symbols.length === 0) throw new Error('No available symbols');

                status.textContent = `Evaluating ${symbols.length} symbols...`;
                const results = await Promise.all(
                    symbols.map(({ symbol, type }) => {
                        const pre = symbol.toUpperCase() === 'THB' ? thbPreloaded : null;
                        return evaluateSymbol(symbol, type, strategy, parameters, timeframe, thb.map, thb.latest, pre)
                            .catch(e => ({ symbol, type, error: e.message, recommendation: 'ERROR' }));
                    })
                );

                renderResults(results, thb.latest);
                status.textContent = `Done - ${results.length} symbols`;
                status.className = 'status';
            } catch (e) {
                status.textContent = 'Error: ' + e.message;
                status.className = 'status disconnected';
            } finally {
                btn.disabled = false;
            }
        }

        document.getElementById('strategy-select').addEventListener('change', renderParameters);
        document.getElementById('run-btn').addEventListener('click', run);

        const style = document.createElement('style');
        style.textContent = `
            .rec-badge { padding: 0.25rem 0.6rem; border-radius: 0.25rem; font-weight: bold; }
            .rec-badge.buy { background: #1a2f23; color: #3fb950; border: 1px solid #238636; }
            .rec-badge.sell { background: #2f1a1a; color: #f85149; border: 1px solid #da3633; }
            .rec-badge.hold { background: #30363d; color: #e6edf3; border: 1px solid #484f58; }
            .sparkline { line-height: 0; }
            .sparkline svg { display: inline-block; }
        `;
        document.head.appendChild(style);

        renderParameters();
    </script>
</body>
</html>
