# Infrastructure Configuration
# Single Source of Truth for all infrastructure components, servers, and remote services
#
# IMPORTANT: This file is the DOCUMENTATION SSOT (Single Source of Truth) for infrastructure.
# Runtime configurations exist in their respective locations:
# - Remote server config: /home/tony/mcp-remote-exec/config.yaml (on tony-dell)
# - Devin CLI MCP client config: /home/tony/.config/devin/mcp_config.json
#
# Use the scripts in scripts/ directory to sync runtime configs with this SSOT:
# - deploy-mcp-config.sh: Deploys config to remote server
# - generate-mcp-configs.py: Generates Devin CLI MCP config
# - validate-configs.sh: Validates consistency between SSOT and runtime configs

# Global infrastructure settings
settings:
  # Environment (development, staging, production)
  environment: "development"
  # Default timeout for remote operations (seconds)
  default_timeout: 300
  # Maximum retry attempts for failed remote operations
  max_retries: 3
  # Enable/disable infrastructure monitoring
  monitoring_enabled: true
  # Log file path for infrastructure operations
  log_file: "logs/infrastructure.log"

# Machine definitions
machines:
  tony_omen:
    name: "tony-omen"
    description: "Primary development machine"
    role: "primary"
    hostname: "localhost"
    ip_address: "127.0.0.1"
    os: "Linux"
    capabilities:
      - "development"
      - "api_server"
      - "database"
      - "mcp_client"
    status: "active"
    
  tony_dell:
    name: "tony-dell"
    description: "Secondary machine for work offloading"
    role: "secondary"
    hostname: "tony-dell"
    ip_address: "192.168.1.42"
    os: "Linux"
    capabilities:
      - "remote_execution"
      - "browser_automation"
      - "gpu_compute"
    status: "active"
    ssh_config:
      host: "192.168.1.42"
      user: "tony"
      strict_host_key_checking: false
      server_alive_interval: 60

# MCP servers configuration
mcp_servers:
  remote_exec_tony_dell:
    name: "remote-exec-tony-dell"
    description: "Remote execution MCP server on tony-dell"
    machine: "tony_dell"
    transport: "stdio"
    enabled: true
    
    # Server configuration
    server:
      host: "0.0.0.0"
      port: 8080
      log_level: "INFO"
    
    # Security settings
    security:
      enable_command_whitelist: false
      enable_path_validation: true
      max_execution_time: 300
      max_output_size: 10485760  # 10MB
    
    # Allowed directories for file operations
    allowed_directories:
      - "/home/tony"
      - "/tmp"
      - "/home/tony/CascadeProjects"
    
    # Command whitelist (if enabled)
    allowed_commands:
      - "/usr/bin/python3"
      - "/usr/bin/node"
      - "/usr/bin/npm"
      - "/usr/bin/git"
      - "/usr/bin/ls"
      - "/usr/bin/cat"
      - "/usr/bin/grep"
      - "/usr/bin/find"
      - "/usr/bin/tail"
      - "/usr/bin/head"
      - "/usr/bin/wc"
      - "/usr/bin/sort"
      - "/usr/bin/uniq"
      - "/usr/bin/cut"
      - "/usr/bin/sed"
      - "/usr/bin/awk"
      - "/usr/bin/curl"
      - "/usr/bin/wget"
      - "/usr/bin/mkdir"
      - "/usr/bin/rm"
      - "/usr/bin/cp"
      - "/usr/bin/mv"
      - "/usr/bin/chmod"
      - "/usr/bin/chown"
      - "/usr/bin/tar"
      - "/usr/bin/zip"
      - "/usr/bin/unzip"
      - "/usr/bin/bash"
      - "/usr/bin/sh"
      - "/usr/bin/echo"
      - "/bin/echo"
    
    # Available tools
    tools:
      - name: "remote_exec"
        description: "Execute commands on remote machine"
        enabled: true
      - name: "remote_read"
        description: "Read files from remote machine"
        enabled: true
      - name: "remote_write"
        description: "Write files to remote machine"
        enabled: true
      - name: "remote_list"
        description: "List directory contents on remote machine"
        enabled: true
      - name: "get_status"
        description: "Get remote machine status"
        enabled: true
    
    # Client configuration
    client:
      wrapper_script: "/home/tony/CascadeProjects/trade/.devin/remote-exec-wrapper.sh"
      config_file: "/home/tony/.config/devin/mcp_config.json"
    
    # Deployment information
    deployment:
      remote_path: "/home/tony/mcp-remote-exec"
      files:
        - "mcp_server.py"
        - "http_server.py"
        - "config.yaml"
        - "requirements.txt"
        - "start.sh"
        - "mcp-remote-exec.service"
      systemd_service: "mcp-remote-exec.service"
      
  playlive_tony_dell:
    name: "playlive.tony-dell"
    description: "Browser automation MCP server on tony-dell"
    machine: "tony_dell"
    transport: "stdio"
    enabled: true
    endpoint: "http://192.168.1.42:9230"
    capabilities:
      - "chrome_automation"
      - "playwright"
      - "browser_testing"

  playlive_local:
    name: "playlive.local"
    description: "Browser automation MCP server on tony-omen"
    machine: "tony_omen"
    transport: "stdio"
    enabled: true
    endpoint: "http://localhost:9231"
    capabilities:
      - "chrome_automation"
      - "playwright"
      - "browser_testing"
    deployment:
      service_path: "/home/tony/CascadeProjects/chaba-omen/mcp/mcp-playlive/playlived.service"
      daemon_path: "/home/tony/CascadeProjects/chaba-omen/mcp/mcp-playlive/playlived.mjs"
      systemd_service: "playlived.service"
      environment:
        PLAYLIVED_PORT: "9231"
        PLAYLIVED_REMOTE_CDP: "http://127.0.0.1:9223"
        PLAYLIVED_LOCAL_CDP: "http://localhost:9222"
      
  mcp_gpu:
    name: "mcp-gpu"
    description: "GPU compute MCP server"
    machine: "tony_omen"
    transport: "stdio"
    enabled: true
    capabilities:
      - "gpu_compute"
      - "imagen"
      - "llama"
    environment:
      IMAGEN_URL: "http://localhost:8080/apps/imagen2/api"
      LLAMA_URL: "http://localhost:8001"

  docs_trade:
    name: "docs-trade"
    description: "Documentation search MCP server for trade project"
    machine: "tony_omen"
    transport: "stdio"
    enabled: true
    capabilities:
      - "documentation_search"
      - "full_text_search"
      - "documentation_indexing"
    deployment:
      docs_path: "/home/tony/CascadeProjects/trade/docs"
      cache_dir: "/home/tony/CascadeProjects/trade/.docs-mcp"
      mcp_tool: "@devista/docs-mcp"
      tools:
        - search_docs
        - get_page
        - list_sections

# Network configuration
network:
  # SSH connection defaults
  ssh:
    default_timeout: 30
    connection_retries: 3
    keep_alive_interval: 60
    
  # HTTP client defaults
  http:
    default_timeout: 30
    connection_pool_size: 10
    max_retries: 3
    
  # Firewall rules (documentation only)
  firewall_rules:
    - source: "tony-omen"
      destination: "tony-dell"
      port: 22
      protocol: "tcp"
      description: "SSH for MCP server communication"
    - source: "tony-omen"
      destination: "tony-dell"
      port: 8080
      protocol: "tcp"
      description: "HTTP API for MCP server (alternative)"
    - source: "tony-omen"
      destination: "tony-dell"
      port: 9230
      protocol: "tcp"
      description: "PlayLive browser automation on tony-dell"
    - source: "tony-omen"
      destination: "tony-omen"
      port: 9231
      protocol: "tcp"
      description: "PlayLive browser automation on tony-omen"

# Monitoring and health checks
monitoring:
  enabled: true
  checks:
    - name: "ssh_connectivity_tony_dell"
      type: "ssh"
      target: "tony_dell"
      interval: 300  # 5 minutes
      timeout: 10
      
    - name: "mcp_server_remote_exec"
      type: "mcp"
      server: "remote_exec_tony_dell"
      interval: 600  # 10 minutes
      timeout: 30
      
    - name: "disk_space_tony_dell"
      type: "system"
      target: "tony_dell"
      metric: "disk_usage"
      threshold: 90  # percent
      interval: 3600  # 1 hour
    
    - name: "trade_api_health"
      type: "http"
      endpoint: "http://localhost:9000/api/health"
      interval: 60  # 1 minute
      timeout: 10
      expected_status: 200
      
    - name: "trade_data_quality"
      type: "http"
      endpoint: "http://localhost:9000/api/data_quality"
      interval: 300  # 5 minutes
      timeout: 15
      
    - name: "trade_automation_status"
      type: "container"
      container: "trade-automation"
      interval: 300  # 5 minutes
      timeout: 10

# Trade system configuration
trade_system:
  # Docker Compose configuration
  docker_compose:
    project_name: "trade"
    compose_file: "docker-compose.yml"
    network: "web_default"
    network_external: true
    services:
      trade-api:
        build:
          context: "."
          dockerfile: "Dockerfile"
        image: "trade-trade-api"
        container_name: "trade-api"
        ports:
          - "9000:9000"
        env_file:
          - .env
        environment:
          - DB_TYPE=postgresql
          - DB_HOST=postgres
          - DB_PORT=5432
          - DB_NAME=dollar_prices
          - DB_USER=chaba
          - DATA_QUALITY_ENABLED=true
        volumes:
          - ./data:/app/data
          - ./config:/app/config
          - ./logs:/app/logs
        networks:
          - web_default
        restart: unless-stopped
        healthcheck:
          test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 40s
        note: "Updated 2026-08-14: Scheduler fixed (job_id vs job.name), OHLC filtering implemented, no estimated values in charts"
      
      trade-automation:
        image: "trade-trade-api"
        container_name: "trade-automation"
        env_file:
          - .env
        environment:
          - DB_TYPE=postgresql
          - DB_HOST=postgres
          - DB_PORT=5432
          - DB_NAME=dollar_prices
          - DB_USER=chaba
          - DATA_QUALITY_ENABLED=true
          - AUTOMATION_ENABLED=true
        volumes:
          - ./data:/app/data
          - ./config:/app/config
          - ./logs:/app/logs
        command: ["python", "scripts/auto_update.py", "--scheduled"]
        networks:
          - web_default
        restart: unless-stopped
        depends_on:
          - trade-api
        healthcheck:
          disable: true
        note: "Updated 2026-08-14: Scheduler fixed (job_id vs job.name), OHLC filtering implemented, no estimated values in charts"
  
  # Database configuration
  database:
    type: "postgresql"
    host: "postgres"
    port: 5432
    name: "dollar_prices"
    user: "chaba"
    shared_instance: true
    shared_with:
      - "weaviate"
    note: "Updated 2026-08-14: PostgreSQL database operational, THB data current as of 2026-08-14, Thai holiday gap Aug 8-11 documented as expected behavior"
  
  # Network configuration
  networks:
    tailscale:
      name: "Tailscale VPN"
      type: "vpn"
      status: "active"
      description: "Private network for cross-machine communication"
      tony_omen_address: "100.75.102.88"
      tony_dell_address: "100.68.142.13"
      purpose: "Cross-machine API access and browser verification"
      note: "Updated 2026-08-14: Used for Playlive browser verification from tony-dell to tony-omen, API endpoint configured to use Tailscale IP (100.75.102.88:9000)"
    
    web_default:
      name: "web_default"
      type: "docker_network"
      external: true
      description: "Docker Compose network for web services"
      note: "Shared with chaba web stack for PostgreSQL database access"
      - "chaba web stack"
    tables:
      - exchange_rates
      - dollar_index
      - commodity_prices
    backup_enabled: false
    backup_schedule: "daily"
    backup_retention: 7
  
  # API endpoints
  api:
    base_url: "http://localhost:9000"
    endpoints:
      health: "/api/health"
      data_quality: "/api/data_quality"
      exchange_rates: "/api/exchange_rates/{currency}"
      dollar_index: "/api/dollar_index"
      commodity_prices: "/api/commodity_prices/{commodity}"
      available_currencies: "/api/available/currencies"
      available_commodities: "/api/available/commodities"
  
  # Data sources configuration
  data_sources:
    thb:
      provider: "open.er-api.com"
      format: "JSON"
      url: "https://open.er-api.com/v6/latest/USD"
      update_frequency: "daily"
      status: "active"
      last_update: "2026-08-10"
    
    dxy:
      provider: "FRED API"
      series_id: "DTWEXBGS"
      format: "CSV"
      url: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DTWEXBGS"
      update_frequency: "daily"
      status: "limited"
      last_update: "2026-07-31"
      note: "DNS issues in containers, use host system for updates"
    
    commodities:
      provider: "Alpha Vantage"
      format: "JSON"
      functions:
        - COPPER: "Copper prices"
        - NATURAL_GAS: "Henry Hub Natural Gas"
        - WTI: "Crude Oil WTI"
        - BRENT: "Crude Oil Brent"
      update_frequency: "monthly"
      status: "active"
      last_update: "2026-08-03"
      note: "WHEAT and CORN removed on 2026-08-10 due to Alpha Vantage monthly data staleness (70+ days)"
    
    currencies:
      provider: "FRED API"
      format: "CSV"
      currencies:
        - EUR: "DEXUSEU"
        - JPY: "DEXJPUS"
        - CAD: "DEXCAUS"
        - CHF: "DEXSZUS"
        - AUD: "DEXUSAL"
        - NZD: "DEXUSNZ"
        - GBP: "DEXUSUK"
        - SEK: "DEXSDUS"
        - NOK: "DEXNOUS"
        - DKK: "DEXDKUS"
        - CZK: "DEXCZUS"
        - HUF: "DEXHUF"
        - PLN: "DEXPLN"
        - INR: "DEXINUS"
        - CNY: "DEXCHUS"
        - KRW: "DEXKOUS"
        - MXN: "DEXMXUS"
        - TRY: "DEXUSTUS"
        - ZAR: "DEXSZUS"
        - BRL: "DEXBZUS"
      update_frequency: "daily"
      status: "limited"
      note: "DNS issues in containers, use host system for updates"
  
  # Data quality thresholds
  data_quality:
    max_freshness_days:
      thb: 2
      currencies: 7
      dxy: 30
      commodities: 90
    min_completeness_pct: 90
    outlier_threshold: 3  # standard deviations

# Backup and recovery
backup:
  enabled: false
  schedules:
    - name: "mcp_server_config"
      target: "tony_dell"
      path: "/home/tony/mcp-remote-exec"
      schedule: "daily"
      time: "02:00"
      retention_days: 7
