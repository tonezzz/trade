# This is the compare2 candidate that uses the modular signal system.
# It is intentionally separate from strategies.js while compare2 is evaluated.
# Do not merge until feature parity with compare.html is confirmed.

cache_busting:
  query_param: v
  versions:
    compare2_html: 11
    chart_loader: 8
    chart_data_provider: 9
    chart_renderer: 9
    ui_components: 4
navigation:
  ref: ssot.ui.yml#navigation
  active_page: compare2
