# FastAPI Configuration

# Server settings
server:
  host: "0.0.0.0"
  port: 9000
  workers: 1
  reload: false
  log_level: "info"

# CORS settings
cors:
  enabled: true
  allow_origins:
    - "http://localhost:8080"
    - "http://tony-omen.local:8080"
    - "http://127.0.0.1:8080"
  allow_credentials: true
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Content-Type"
    - "Authorization"
    - "X-Requested-With"

# Rate limiting
rate_limiting:
  enabled: false
  requests_per_minute: 60
  requests_per_hour: 1000

# API documentation
docs:
  enabled: true
  docs_url: "/docs"
  redoc_url: "/redoc"
  openapi_url: "/openapi.json"

# Database settings (can override environment variables)
database:
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
  pool_recycle: 3600

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: null
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Response settings
response:
  default_limit: 1000
  max_limit: 10000
  include_metadata: true

# Cache settings (for future implementation)
cache:
  enabled: false
  ttl: 300  # 5 minutes

# WebSocket settings
websocket:
  enabled: true
  
  # Polling intervals (in seconds)
  polling:
    exchange_rate_interval: 5
    dollar_index_interval: 5
    commodity_interval: 5
  
  # Rate limiting
  rate_limiting:
    max_connections_per_ip: 10
    connection_timeout: 300  # 5 minutes
    max_message_size: 1048576  # 1MB
  
  # Performance settings
  performance:
    max_subscriptions_per_client: 50
    heartbeat_interval: 30  # seconds
    heartbeat_timeout: 60  # seconds
  
  # Data batching
  batching:
    enabled: true
    batch_size: 10
    batch_timeout: 1.0  # seconds
