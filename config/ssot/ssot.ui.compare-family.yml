title: TradeCanvas Compare Family Configuration
subtitle: Shared settings for compare and compare2 pages
version: 2
status: active
defaults_ref: ssot.ui.defaults.yml
defaults: {}
family:
  members:
  - compare
  - compare2
chart_loader:
  ref: ssot.ui.defaults.yml#chart_loader
  show_indicators: false
  enable_web_socket: false
  auto_refresh: false
currency_selector:
  container_id: currency-selector-container
  selected_currency_ref: ssot.ui.defaults.yml#currency.symbol
  currencies_ref: ssot.ui.defaults.yml#currencies
strategy_panel:
  ref: ssot.ui.yml#strategy_panel
  enabled: true
  position: side-panel
scripts:
  shared:
  - chart-data-provider.js
  - chart-renderer.js
  - chart-loader.js
  - hindsight-strategies-new.js
  - strategy-compare-new.js
features:
  inherit:
    - ssot.ui.feature.chart-controls.yml
    - ssot.ui.feature.currency-selector-compact.yml
    - ssot.ui.feature.strategy-panel-hindsight.yml
    - ssot.ui.feature.compact-layout.yml

recent_changes:
  - date: 2026-08-25
    description: "Reference canonical defaults from ssot.ui.defaults.yml instead of hard-coding values"
    impact: "Reduces drift with ssot.ui.state.yml and pages; currency list is single-source"
