title: Data Updating Verification
subtitle: How data updating status is checked and where the latest verified state is stored
icon: 
version: 2

sections:
  - title: Verification Method
    icon: 
    layout: list
    items: verification
  - title: Latest Findings
    icon: 
    layout: list
    items: latest_findings
  - title: Commands
    icon: 
    layout: list
    items: commands
  - title: Recent Changes
    icon: 
    layout: list
    items: recent_changes

runtime_state_file: reports/DATA_VERIFICATION_STATE.json

verification:
  host: tony-dell
  runtime: podman
  container_engine_command: podman
  note: "Trade services on tony-dell run under Podman, not Docker. Port 9000 is already used by other services (mddb, raceman), so trade-api is exposed on 127.0.0.1:9002."

  trade_api:
    container: trade-api
    internal_port: 9000
    host_port: 9002
    host_address: 127.0.0.1
    health_url: http://localhost:9002/api/health
    data_quality_url: http://localhost:9002/api/data_quality
    expected_status: 200

  trade_automation:
    container: trade-automation
    command: python /app/scripts/auto_update.py --scheduled
    scheduled_jobs: 14

commands:
  list_containers: "podman ps --format \"table {{.Names}}\\t{{.Status}}\\t{{.Ports}}\""
  health_check: "curl -s http://localhost:9002/api/health | python3 -m json.tool"
  data_quality: "curl -s http://localhost:9002/api/data_quality | python3 -m json.tool"
  auto_update_status: "podman exec trade-automation python /app/scripts/auto_update.py --status"
  automation_logs: "podman logs trade-automation --tail 30"

recent_changes:
  - date: 2026-08-17
    description: "Created ssot.data-verification.yml to record Podman port mapping (9002) and current data freshness findings."
    impact: "Verification procedure and the latest data-updating status are now in SSOT."

  - date: 2026-08-25
    description: "Moved runtime findings to reports/DATA_VERIFICATION_STATE.json. ssot.data-verification.yml now only describes the procedure."
    impact: "Separation of configuration/state reduces SSOT churn and git noise."
