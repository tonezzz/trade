services:
  # Trade API Service
  - id: trade-api
    name: Trade API
    type: container
    container: trade-api
    expected_state: running
    timeout: 10
    category: api
    url: http://localhost:8080/apps/trade/api/health
    expected_status: 200
    note: Podman container on tony-dell, PostgreSQL database (dollar_prices), exposed on host 0.0.0.0:9002->9000/tcp; health check via Caddy on port 8080 (localhost:9002 is not reachable from tony-dell shell, use 8080), updated 2026-08-27

  # Trade Automation Service
  - id: trade-automation
    name: Trade Automation
    type: container
    container: trade-automation
    expected_state: running
    timeout: 10
    category: api
    note: Podman container on tony-dell, data update scheduler, PostgreSQL (dollar_prices), disabled HTTP healthcheck, 14 jobs scheduled, catch-up 8/8 successful, DataQualityAgent 100% validation success, updated 2026-08-27

  # Database Health (PostgreSQL)
  - id: trade-database
    name: Trade Database
    type: postgresql
    host: postgres
    port: 5432
    database: dollar_prices
    user: chaba
    expected_state: reachable
    timeout: 5
    category: datastore
    note: PostgreSQL database shared with chaba web stack, created 2026-08-13, tables created via SQLAlchemy

# Recovery suggestions for common failure modes
recovery_actions:
  container_down: "Check podman status: `podman ps`, Restart container: `podman restart <container>`, Check logs: `podman logs <container>`"
  http_error: "Check if service is running: `podman ps`, Check service logs for errors, Verify port is accessible: `curl -v <url>`, Restart service if needed"
  database_missing: "Check if database file exists: `ls -la data/dollar_prices.db`, Restore from backup if needed, Reinitialize database: `python scripts/setup_database.py`"
  dns_resolution: "FRED API has DNS issues in containers, use Alpha Vantage API instead, Check network connectivity: `podman exec <container> python -c 'import socket; print(socket.gethostbyname(\"google.com\"))'`"
  data_freshness: "As of 2026-08-27: THB latest 2026-08-26 (fresh), DXY latest 2026-08-21 (6 days old, acceptable), commodity_prices latest 2026-08-27 (fresh, GOLD 4615.45). All 6 currencies (AUD, CAD, CHF, JPY, NZD, THB) current. Automation 14 jobs scheduled, catch-up 8/8 successful, DataQualityAgent 100% validation. Known issues: 5 dates in May 2025 with incomplete currency coverage, COPPER 222/OIL 52/NATURAL_GAS 85 potential outliers, GOLD only 2 records (spot-only), SILVER only 1 record"

# Testing and debugging guidance
debugging_guidance:
  local_testing:
    - Use Caddy-proxied URLs on port 8080 (localhost:9002 is not reachable from tony-dell shell)
    - "Test API endpoints: `curl http://localhost:8080/apps/trade/api/health`"
    - "Check data quality: `curl http://localhost:8080/apps/trade/api/data_quality`"
    - "Check container logs: `podman logs -f trade-api`"
    - "Verify database connectivity: `podman exec trade-api python -c \"from src.database import get_db; print('DB OK')\"`"

  service_testing:
    - 'Check all services: `podman ps`'
    - 'Restart specific service: `podman restart trade-api`'
    - 'View logs: `podman logs -f trade-api`'
    - 'Rebuild service: `podman build -t trade-trade-api:latest . && podman rm -f trade-api && <start command from ssot.infrastructure.yml>`'
    - 'Test data import: `podman exec trade-api python -c "from src.importer import DataImporter; from src.database import get_db; ..."`'

  data_validation:
    - 'Check data quality: `curl http://localhost:8080/apps/trade/api/data_quality`'
    - 'Verify THB data: `curl http://localhost:8080/apps/trade/api/exchange_rates/THB`'
    - 'Check commodity data: `curl http://localhost:8080/apps/trade/api/commodity_prices/COPPER`'
    - 'Run manual data update: `python download_data.py format_alpha_vantage_commodity`'
    - 'Note: OIL outlier threshold is 100% (vs 50%) due to high volatility'
    - 'Run freshness monitor: `podman exec trade-api python scripts/data_freshness_monitor.py`'

# Data source configuration notes
# See config/ssot/ssot.data.yml for the authoritative data source configuration.
data_sources:
  thb: "open.er-api.com (primary), exchangerate-api.com (fallback), Frankfurter ECB spot (daily), current as of 2026-08-26, rate 32.745"
  dxy: "FRED API (DTWEXBGS series), no Alpha Vantage support, latest 2026-08-21, value 118.0628"
  commodities: "Alpha Vantage API (WTI, BRENT, COPPER, NATURAL_GAS monthly data) - WHEAT/CORN removed 2026-08-10, OIL latest 2026-08-27"
  currencies: "FRED API (JPY, CAD, CHF, AUD, NZD), validated against open.er-api.com / exchangerate-api.com, all current as of 2026-08-26"
  precious_metals: "GitHub datasets (GOLD/XAU, SILVER/XAG) with Minted Metal validation and MetalPrices fallback; GOLD has only 2 records (spot-only, no historical series), SILVER has only 1 record"
  ohlc_policy: "Only real OHLC data shown in charts - no estimated/fallback values, records without proper OHLC are excluded from chart display"

