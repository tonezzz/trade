title: Trade Project Health Check Configuration
subtitle: Health check endpoints and monitoring for trade services
icon: 🏥
version: 3

sections:
  - title: Services
    icon: 🚀
    items: services
  - title: Recovery Actions
    icon: 🔧
    items: recovery_actions
  - title: Debugging Guidance
    icon: 🔍
