# Data Sources Configuration for Automated Download and Import
# This is the authoritative SSOT for Trade data sources. It defines all download
# targets, scheduling, and the consolidated provider/alternative map used for
# validation and redundancy.

# Consolidated data source provider policy
# Maps each category to its primary, fallback, and validation providers.
data_source_policy:
  # Currencies: FRED provides daily historical series. open.er-api.com and
  # exchangerate-api.com provide current spot rates for validation.
  exchange_rates:
    primary: "FRED"
    current_spot: "open.er-api.com"
    fallback_current_spot: "exchangerate-api.com"
    note: "FRED series are USD/base and are inverted on import to base/USD."

  thb:
    primary: "open.er-api.com"
    fallback: "exchangerate-api.com"

  # Commodities: Alpha Vantage is the primary source for energy and industrial
  # metals. Precious metals use GitHub historical datasets and are validated
  # against Minted Metal / MetalPrices.
  commodities:
    primary: "Alpha Vantage"
    symbols:
      - WTI
      - BRENT
      - COPPER
      - NATURAL_GAS

  precious_metals:
    primary: "GitHub datasets (historical)"
    validation: "Minted Metal"
    fallback: "MetalPrices API"

  # Dollar index: FRED is the only supported source.
  dxy:
    primary: "FRED"
    series_id: "DTWEXBGS"

# Data quality policy
data_quality_policy:
  ohlc: "Only real OHLC data is stored and displayed - no estimated/fallback values"
  chart_display: "Records without proper OHLC data are excluded from chart display"
  holiday_gaps: "Thai holiday gaps (e.g., Aug 8-11, 2026) are expected behavior"
  data_freshness: "System uses tolerance settings to account for intermittent availability"

# Global settings
settings:
  # Directory for downloaded data files
  download_dir: "data/archive"
  # Directory for formatted/import-ready data files
  import_dir: "data/imported"
  # Number of retry attempts for failed downloads
  max_retries: 3
  # Initial retry delay in seconds (will use exponential backoff)
  retry_delay: 5
  # Enable/disable dry run mode (no actual downloads/imports)
  dry_run: false
  # Log file path for automation logs
  log_file: "logs/automation.log"
  # Enable email notifications on errors
  enable_notifications: false
  # Notification email (if enabled)
  notification_email: ""
  # Skip validation errors (continue import despite validation failures)
  skip_validation: true
  
  # Data quality settings
  data_quality:
    enabled: true
    tolerance_pct: 2.0
    max_freshness_days: 2
    min_completeness_pct: 90.0
    alert_threshold: 3
    run_after_import: true
    schedule: "daily"
    schedule_time: "18:00"
    history_days: 30
  
  # Data quality settings
  min_data_points: 1000  # Minimum data points for valid import
  max_gap_days: 7       # Maximum allowed gap in days
  require_ohlc: false    # Whether OHLC data is required
  
  # Tolerance settings for intermittent availability
  # These define how many days of staleness is acceptable for each data source.
  # A value of 0 means "today only".
  tolerance:
    thb: 0          # THB data: must be from today
    gold: 0         # GOLD data: must be from today
    dxy: 30         # DXY data: 30 days acceptable (FRED API limitation)
    commodities: 90 # Commodity data: 90 days acceptable (monthly updates)
    currencies: 7  # Currency data: 7 days acceptable
  
  # Catch-up settings for intermittent availability.
  # When on_startup is true, the automation scheduler MUST run catch-up
  # updates before it begins its normal schedule loop.
  catch_up:
    enabled: true
    on_startup: true
    max_gap_days: 30
    check_interval_hours: 6
    implementation: "scripts/auto_update.py --scheduled runs src/scheduler.run_catch_up_updates() before start_scheduler()"
    note: "Prevents stale data after a container restart by executing missed jobs immediately."
  
  # API rate limiting
  rate_limit_requests: 10
  rate_limit_period: 60  # seconds
  
  # Data validation
  validate_price_ranges: true
  validate_date_sequences: true

# Data source categories
categories:
  currencies:
    description: "Major currency pairs vs USD"
    priority: "high"
  commodities:
    description: "Precious metals, energy, and agricultural commodities"
    priority: "medium"
  indices:
    description: "Market indices and benchmarks"
    priority: "high"

# Data sources configuration
data_sources:
  # WTI Crude Oil Data
  wti_oil:
    name: "WTI Crude Oil"
    description: "West Texas Intermediate crude oil prices (Alpha Vantage)"
    type: "commodity"
    symbol: "WTI"
    commodity: "OIL"
    unit: "barrel"
    # Primary: Alpha Vantage commodity API
    url: "https://www.alphavantage.co/query?function=WTI&apikey=KUTH6I3J1OORWZI8"
    # Schedule: monthly at 6:00 AM (Alpha Vantage commodity update frequency)
    schedule: "monthly"
    schedule_time: "06:00"
    # Import function to use
    import_function: "import_commodity_prices"
    # Data source identifier for database
    source: "alphavantage_wti"
    # Enable/disable this source
    enabled: true
    # Custom formatter function
    formatter: "format_alpha_vantage_commodity"

  # Brent Crude Oil Data
  brent_oil:
    name: "Brent Crude Oil"
    description: "Brent crude oil prices (Alpha Vantage)"
    type: "commodity"
    symbol: "BRENT"
    commodity: "OIL"
    unit: "barrel"
    # Primary: Alpha Vantage commodity API
    url: "https://www.alphavantage.co/query?function=BRENT&apikey=KUTH6I3J1OORWZI8"
    # Schedule: monthly at 6:00 AM (Alpha Vantage commodity update frequency)
    schedule: "monthly"
    schedule_time: "06:00"
    # Import function to use
    import_function: "import_commodity_prices"
    # Data source identifier for database
    source: "alphavantage_brent"
    # Enable/disable this source
    enabled: true
    # Custom formatter function
    formatter: "format_alpha_vantage_commodity"

  # ECB Exchange Rates
  ecb_exchange_rates:
    name: "ECB Exchange Rates"
    description: "European Central Bank daily reference exchange rates"
    type: "exchange_rate"
    # Download URL for ECB data
    url: "https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml"
    # Schedule: daily at 5:00 PM (after ECB release)
    schedule: "daily"
    schedule_time: "17:00"
    # Import function to use
    import_function: "import_exchange_rates"
    # Data source identifier for database
    source: "automated_ecb"
    # Enable/disable this source
    enabled: false  # Disabled due to limited currency coverage
    # Custom formatter function (optional)
    formatter: "format_ecb_data"
    # Base currency for ECB data
    base_currency: "EUR"

  # Japanese Yen
  jpy_exchange_rates:
    name: "USD/JPY Exchange Rates"
    description: "USD to Japanese Yen daily exchange rates"
    type: "exchange_rate"
    symbol: "JPY"
    quote_currency: "JPY"
    url: "https://api.fred.stlouisfed.org/graph/fredgraph.csv?id=DEXJPUS"
    schedule: "daily"
    schedule_time: "17:00"
    import_function: "import_exchange_rates"
    source: "automated_jpy"
    enabled: true
    formatter: "format_currency_data"

  # Canadian Dollar
  cad_exchange_rates:
    name: "USD/CAD Exchange Rates"
    description: "USD to Canadian Dollar daily exchange rates"
    type: "exchange_rate"
    symbol: "CAD"
    quote_currency: "CAD"
    url: "https://api.fred.stlouisfed.org/graph/fredgraph.csv?id=DEXCAUS"
    schedule: "daily"
    schedule_time: "17:00"
    import_function: "import_exchange_rates"
    source: "automated_cad"
    enabled: true
    formatter: "format_currency_data"

  # Swiss Franc
  chf_exchange_rates:
    name: "USD/CHF Exchange Rates"
    description: "USD to Swiss Franc daily exchange rates"
    type: "exchange_rate"
    symbol: "CHF"
    quote_currency: "CHF"
    url: "https://api.fred.stlouisfed.org/graph/fredgraph.csv?id=DEXSZUS"
    schedule: "daily"
    schedule_time: "17:00"
    import_function: "import_exchange_rates"
    source: "automated_chf"
    enabled: true
    formatter: "format_currency_data"

  # Australian Dollar
  aud_exchange_rates:
    name: "USD/AUD Exchange Rates"
    description: "USD to Australian Dollar daily exchange rates"
    type: "exchange_rate"
    symbol: "AUD"
    quote_currency: "AUD"
    url: "https://api.fred.stlouisfed.org/graph/fredgraph.csv?id=DEXUSAL"
    schedule: "daily"
    schedule_time: "17:00"
    import_function: "import_exchange_rates"
    source: "automated_aud"
    enabled: true
    formatter: "format_currency_data"

  # New Zealand Dollar
  nzd_exchange_rates:
    name: "USD/NZD Exchange Rates"
    description: "USD to New Zealand Dollar daily exchange rates"
    type: "exchange_rate"
    symbol: "NZD"
    quote_currency: "NZD"
    url: "https://api.fred.stlouisfed.org/graph/fredgraph.csv?id=DEXUSNZ"
    schedule: "daily"
    schedule_time: "17:00"
    import_function: "import_exchange_rates"
    source: "automated_nzd"
    enabled: true
    formatter: "format_currency_data"

  # Thai Baht
  thb_exchange_rates:
    name: "USD/THB Exchange Rates"
    description: "USD to Thai Baht daily exchange rates"
    type: "exchange_rate"
    symbol: "THB"
    quote_currency: "THB"
    url: "https://open.er-api.com/v6/latest/USD"
    fallback_url: "https://api.exchangerate-api.com/v4/latest/USD"
    validation_url: "https://open.er-api.com/v6/latest/USD"
    schedule: "daily"
    schedule_time: "17:00"
    import_function: "import_exchange_rates"
    source: "automated_thb"
    enabled: true
    formatter: "format_thb_data"

  # Thai Baht spot rate via Frankfurter (ECB)
  thb_frankfurter_spot:
    name: "USD/THB Frankfurter Spot"
    description: "USD/THB spot reference rate from Frankfurter (ECB)"
    type: "frankfurter"
    symbol: "THB"
    quote_currency: "THB"
    url: "https://api.frankfurter.dev/v1"
    schedule: "daily"
    schedule_time: "18:00"
    import_function: "import_exchange_rates"
    source: "automated_thb_frankfurter"
    enabled: true

  # US Dollar Index (DXY)
  dxy:
    name: "US Dollar Index"
    description: "US Dollar Index (DXY) daily values"
    type: "dollar_index"
    symbol: "DXY"
    # Download URL for DXY data (using FRED - DTWEXBGS)
    url: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DTWEXBGS"
    # Schedule: daily at 6:00 PM
    schedule: "daily"
    schedule_time: "18:00"
    # Import function to use
    import_function: "import_dollar_index"
    # Data source identifier for database
    source: "automated_dxy"
    # Enable/disable this source
    enabled: true
    formatter: "format_dxy_data"  # Fixed data source to use FRED API

  # Gold Prices
  gold:
    name: "Gold Prices"
    description: "Gold (XAU) daily prices"
    type: "commodity"
    symbol: "XAU"
    commodity: "GOLD"
    unit: "oz"
    # Download URL for gold data
    url: "https://raw.githubusercontent.com/datasets/gold-prices/main/data/gold-daily.csv"
    # Schedule: weekly on Monday at 8:00 AM
    schedule: "weekly"
    schedule_day: "monday"
    schedule_time: "08:00"
    # Import function to use
    import_function: "import_commodity_prices"
    # Data source identifier for database
    source: "automated_gold"
    # Enable/disable this source
    enabled: true
    # Custom formatter function (optional)
    formatter: "format_gold_data"
    # Validation source for current spot price
    validation_source: "Minted Metal"
    validation_url: "https://mintedmetal.com/api/prices.json"

  # Thai Gold Prices (XAU/THB) - GoldAPI.io
  thai_gold:
    name: "Thai Gold Prices"
    description: "Gold prices in Thai Baht (XAU/THB) via GoldAPI.io"
    type: "commodity"
    symbol: "XAU-THB"
    commodity: "GOLD"
    unit: "oz"
    # API endpoint for Thai gold data
    url: "https://www.goldapi.io/api/XAU/THB"
    # Historical endpoint pattern: https://www.goldapi.io/api/XAU/THB/YYYYMMDD
    historical_url_pattern: "https://www.goldapi.io/api/XAU/THB/{date}"
    # Schedule: disabled for now - using manual historical fetch to build dataset
    schedule: "manual"
    # Only run on weekdays (Thai gold markets closed weekends)
    weekdays_only: true
    # Import function to use
    import_function: "import_commodity_prices"
    # Data source identifier for database
    source: "goldapi_thai_gold"
    # Enable/disable this source
    enabled: false  # Disabled until we build historical dataset
    # Custom formatter function (optional)
    formatter: "format_thai_gold_data"
    # API rate limiting (100 calls/month free tier)
    rate_limit:
      max_calls_per_month: 100
      require_api_key: true
      cache_duration_hours: 24
      use_cache_first: true
    # Fallback to free Thai Gold API if limit reached
    fallback_api: "https://api.chnwt.dev/thai-gold-api/latest"
    # Note: Use download_thai_gold.py --mode historical for manual data fetching

  # Silver Prices
  silver:
    name: "Silver Prices"
    description: "Silver (XAG) daily prices"
    type: "commodity"
    symbol: "XAG"
    commodity: "SILVER"
    unit: "oz"
    url: "https://raw.githubusercontent.com/datasets/silver-prices/main/data/silver-daily.csv"
    schedule: "weekly"
    schedule_day: "monday"
    schedule_time: "08:00"
    import_function: "import_commodity_prices"
    source: "automated_silver"
    enabled: true
    formatter: "format_commodity_data"
    # Validation source for current spot price
    validation_source: "Minted Metal"
    validation_url: "https://mintedmetal.com/api/prices.json"

  # Copper Prices (Alpha Vantage)
  copper:
    name: "Copper Prices"
    description: "Copper monthly prices per metric ton (Alpha Vantage)"
    type: "commodity"
    symbol: "COPPER"
    commodity: "COPPER"
    unit: "metric_ton"
    url: "https://www.alphavantage.co/query?function=COPPER&apikey=KUTH6I3J1OORWZI8"
    schedule: "monthly"
    schedule_time: "06:00"
    import_function: "import_commodity_prices"
    source: "alphavantage_copper"
    enabled: true  # Using Alpha Vantage API instead of FRED
    formatter: "format_alpha_vantage_commodity"

  # Natural Gas Prices (Alpha Vantage)
  natural_gas:
    name: "Natural Gas Prices"
    description: "Natural Gas monthly prices per million BTU (Alpha Vantage)"
    type: "commodity"
    symbol: "NATURAL_GAS"
    commodity: "NATURAL_GAS"
    unit: "MMBtu"
    url: "https://www.alphavantage.co/query?function=NATURAL_GAS&apikey=KUTH6I3J1OORWZI8"
    schedule: "monthly"
    schedule_time: "06:00"
    import_function: "import_commodity_prices"
    source: "alphavantage_natural_gas"
    enabled: true  # Using Alpha Vantage API instead of FRED
    formatter: "format_alpha_vantage_commodity"

  # Commodity Data Sources Removed
  # Wheat, Corn, and Soy have been removed from the system
  # Reason: Alpha Vantage API limitations and data quality issues
  # Wheat and Corn were disabled due to monthly data staleness (70+ days)
  # Soy was disabled because Alpha Vantage doesn't have SOY function
  # Data removed from database on 2026-08-10

# Schedule types and their meanings
# - daily: Run once per day at specified time
# - weekly: Run once per week on specified day at specified time
# - hourly: Run every hour
# - interval: Run at specified interval in minutes

# ACTUAL DATA SOURCE ARCHITECTURE (2026-08-06)
# ===========================================
# This SSOT defines AUTOMATED DOWNLOAD sources, but actual data usage differs:
#
# 1. USD/THB EXCEPTION:
#    - SSOT defines: FRED API (DEXTHUS series)
#    - ACTUAL usage: open.er-api.com (via download_thb_data.py)
#    - REASON: Better THB coverage, real-time rates, more reliable
#
# 2. COMMODITY VALIDATION:
#    - SSOT defines: FRED API for most commodities
#    - ACTUAL validation: Alpha Vantage API (via data_quality_agent.py)
#    - REASON: Alpha Vantage has better commodity coverage, real-time data
#    - Functions: WHEAT, CORN, WTI, BRENT, NATURAL_GAS, COPPER
#
# 3. PRECIOUS METALS:
#    - SSOT defines: GitHub datasets for gold/silver
#    - ACTUAL validation: Minted Metal API (primary), MetalPrices API (fallback)
#    - REASON: Alpha Vantage doesn't provide spot prices for XAU/XAG
#    - Minted Metal: LBMA benchmark prices, free, no API key, updates twice daily
#    - MetalPrices API: Backup source (100 requests/month free tier)
#    - Alternative: Could use Alpha Vantage ETFs (GLD, SLV) as proxies
#
# 4. EXCHANGE RATE VALIDATION:
#    - Primary: exchangerate-api.com (free tier: 1,500 requests/month)
#    - Secondary: FRED API (requires API key, 120 requests/minute)
#    - Alpha Vantage: NOT used (limited forex coverage, no THB support)
#
# 5. DOLLAR INDEX (DXY):
#    - SSOT: FRED API (DTWEXBGS series) ✅ CORRECT
#    - ACTUAL: FRED API ✅ MATCHES
#    - Alpha Vantage: NOT supported for DXY
#
# MCP INTEGRATION STATUS:
# ======================
# - Alpha Vantage MCP server configured: ~/.config/devin/mcp_config.json
# - Used for: Tool discovery, testing, validation
# - NOT used in: Production Python scripts (direct HTTP calls instead)
# - Benefits: 100+ financial data endpoints, automatic function discovery
# - Current limitation: Precious metals (XAU, XAG) require MetalPrices API fallback
#
# API KEYS REQUIRED:
# ==================
# - ALPHA_VANTAGE_API_KEY: KUTH6I3J1OORWZI8 ✅ Configured
# - FRED_API_KEY: Required for FRED data sources
# - METAL_PRICES_API_KEY: Optional backup for precious metals validation (100 requests/month free tier)
# - Minted Metal API: No API key required (free, LBMA benchmark prices)
#
# DATA QUALITY STATUS:
# ====================
# - Overall success rate: 41.2% (improved from 29.4% after THB fix)
# - USD/THB: ✅ Current (33.1197 as of 2026-08-06)
# - Commodities: ✅ Fetching correctly via Alpha Vantage
# - Currencies: ⚠️ 7/8 failing validation (value differences 4-68%)
# - DXY: ⚠️ 6 days stale
#
# VALIDATION SOURCE CONFIGURATION:
# ================================
# Minted Metal API (Primary for Precious Metals):
# - Endpoint: https://mintedmetal.com/api/prices.json
# - Coverage: GOLD (XAU), SILVER (XAG), PLATINUM (XPT), PALLADIUM (XPD), RHODIUM
# - Source: LBMA benchmark prices (authoritative)
# - Update Schedule: Twice daily at 11:00 and 16:00 UTC (Mon-Fri)
# - Rate Limit: No hard limit, but poll no more than once every 15 minutes
# - Cost: Free, no API key required
# - License: CC BY 4.0 (attribution required: "Cite: Minted Metal (mintedmetal.com)")
# - Data Format: JSON with CORS enabled
# - Integration: Added to data_quality_agent.py as primary validation source for precious metals

