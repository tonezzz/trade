# Source Evaluation Matrix
source_evaluation:
  reliability:
    high:
      - "FRED (historical currencies)"
      - "Minted Metal (precious metals validation)"
      - "Bank of Thailand (THB historical)"
    medium:
      - "Alpha Vantage (commodities)"
      - "open.er-api.com (current THB)"
      - "ECB (European currencies)"
    low:
      - "GitHub datasets (manual updates)"
      - "MetalPrices (fallback only)"

  coverage:
    comprehensive:
      - "FRED (major currencies)"
      - "Alpha Vantage (commodities)"
    limited:
      - "open.er-api.com (current only)"
      - "Bank of Thailand (Thai region only)"
      - "Minted Metal (precious metals only")

  cost_effectiveness:
    excellent:
      - "FRED (free, no rate limits)"
      - "Minted Metal (free, no rate limits)"
      - "ECB (free, no rate limits)"
    good:
      - "open.er-api.com (free, reasonable limits)"
      - "Alpha Vantage (free, limited daily)"
    poor:
      - "GoldAPI (very low rate limits)"
      - "Premium services (expensive)"

  integration_complexity:
    simple:
      - "open.er-api.com (simple JSON API)"
      - "Minted Metal (simple JSON endpoint)"
      - "ECB (direct XML download)"
    moderate:
      - "Alpha Vantage (function-based API)"
      - "FRED (CSV download with parameters)"
    complex:
      - "Bloomberg (requires subscription, complex API)"
      - "Quandl (complex database structure)"

# Recommended Improvements
recommended_improvements:
  priority_high:
    - "Add Frankfurter API for historical currency data with holiday coverage (50+ central banks, 1948-present)"
    - "Add exchangerate.dev for historical data back to 1999 with live rates for major pairs"
    - "Add irfanokr/currency-api for 170+ currencies including precious metals with no rate limits"
    - "Add Bank of Thailand API for THB historical holiday coverage"
    - "Implement FRED DNS workaround or alternative for container reliability"

  priority_medium:
    - "Add XRates API for time-series data and rate fluctuation analysis"
    - "Add Investing.com API for commodity data redundancy"
    - "Implement Quandl for additional economic data sources"
    - "Add CurrencyLayer as additional current rate fallback"

  priority_low:
    - "Evaluate OpenExchangeAPI for premium needs (real-time, high precision)"
    - "Evaluate Bloomberg Terminal for premium needs"
    - "Consider Thai Government Data Portal for regional data"
    - "Explore additional commodity-specific APIs"

# Implementation Notes
implementation_notes:
  thb_holiday_strategy: "Use Bank of Thailand API for historical Thai holiday periods, combine with open.er-api.com for current rates"
  container_dns_workaround: "Use host networking or DNS configuration for FRED access in containers, or implement fallback to alternative sources"
  rate_limit_management: "Implement request queuing and caching for rate-limited APIs, prioritize critical data sources"
  validation_strategy: "Use Minted Metal as primary validation for precious metals, MetalPrices as fallback, cross-check with multiple sources for critical data