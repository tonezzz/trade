# Data source provider policy
# Maps each category to its primary, fallback, and validation providers.
# "status" = active (wired into ssot.data.yml / scripts) or candidate (not implemented).
data_source_policy:
  # Currencies: Multi-source strategy for reliability
  exchange_rates:
    status: "active"
    primary: "FRED"
    current_spot: "open.er-api.com"
    fallback_current_spot: "exchangerate-api.com"
    validation: "open.er-api.com, exchangerate-api.com"
    candidate_historical:
      - "Frankfurter API"
      - "exchangerate.dev"
      - "irfanokr/currency-api"
    broad_coverage: "irfanokr/currency-api"
    note: "FRED series are USD/base and are inverted on import. New historical sources are candidates only."

  thb:
    status: "active"
    primary: "open.er-api.com"
    fallback: "exchangerate-api.com"
    validation: "open.er-api.com, exchangerate-api.com"
    historical_candidate: "Bank of Thailand API"
    broad_coverage: "irfanokr/currency-api"
    note: "THB currently comes from open.er-api.com; Bank of Thailand is a candidate for historical holiday coverage."

  # Commodities: Alpha Vantage primary with multiple fallbacks
  commodities:
    status: "active"
    primary: "Alpha Vantage"
    validation: "Alpha Vantage"
    fallback:
      - "Investing.com API"
      - "GitHub datasets"
    time_series_candidate: "XRates API"
    symbols:
      - WTI
      - BRENT
      - COPPER
      - NATURAL_GAS
    note: "Wheat, corn and soy were removed on 2026-08-10 due to staleness. Investing.com and XRates are candidates."

  precious_metals:
    status: "active"
    primary: "GitHub datasets (historical)"
    validation: "Minted Metal"
    fallback: "MetalPrices API"
    thai_gold: "GoldAPI.io"
    thai_gold_fallback: "https://api.chnwt.dev/thai-gold-api/latest"
    broad_coverage: "irfanokr/currency-api (includes XAU, XAG)"
    note: "LBMA benchmark prices are authoritative for precious metals validation."

  # Dollar index: Multi-source strategy
  dxy:
    status: "active"
    primary: "FRED"
    series_id: "DTWEXBGS"
    validation: "FRED"
    fallback: "Bloomberg"
    note: "FRED has DNS issues in containers and was 6 days stale as of 2026-08-06."

# Exchange Rate Sources
exchange_rate_sources:
  # Primary Historical Sources
  fred:
    name: "Federal Reserve Economic Data (FRED)"
    type: "historical"
    coverage: "Major currencies (EUR, GBP, JPY, CAD, CHF, AUD, NZD, DXY)"
    format: "CSV"
    frequency: "Daily"
    history: "1970s-present (varies by series)"
    cost: "FREE"
    api_key: "Required (free tier available)"
    rate_limit: "120 requests/minute (free tier)"
    url: "https://fred.stlouisfed.org/"
    series_mapping:
      THB: "DEXTHUS"
      JPY: "DEXJPUS"
      CAD: "DEXCAUS"
      CHF: "DEXSZUS"
      AUD: "DEXUSAL"
      NZD: "DEXUSNZ"
      DXY: "DTWEXBGS"
    pros:
      - "Authoritative US Federal Reserve data"
      - "Long historical coverage"
      - "Daily frequency"
      - "Well-documented API"
    cons:
      - "DNS issues in Docker containers"
      - "Limited holiday coverage for non-US markets"
      - "USD/base format requires inversion"
      - "No real-time data"

  # Current Spot Rate Sources
  open_exchange_rates:
    name: "Open Exchange Rates"
    type: "current"
    coverage: "170+ currencies"
    format: "JSON"
    frequency: "Hourly updates"
    history: "Current only (no historical API)"
    cost: "FREE"
    api_key: "Required (free tier: 1,000 requests/month)"
    rate_limit: "1,000 requests/month (free tier)"
    url: "https://open.er-api.com/"
    thb_specific: true
    pros:
      - "Excellent THB coverage"
      - "Reliable and fast"
      - "Simple API"
      - "Good for current spot rates"
    cons:
      - "No historical data API"
      - "Rate limits on free tier"
      - "Hourly updates only"

  exchangerate_api:
    name: "ExchangeRate-API"
    type: "current"
    coverage: "160+ currencies"
    format: "JSON"
    frequency: "Hourly updates"
    history: "Current only (no historical API)"
    cost: "FREE"
    api_key: "Required (free tier: 1,500 requests/month)"
    rate_limit: "1,500 requests/month (free tier)"
    url: "https://www.exchangerate-api.com/"
    pros:
      - "Good currency coverage"
      - "Fallback for open.er-api.com"
      - "Simple API"
    cons:
      - "No historical data API"
      - "Rate limits on free tier"
      - "Less reliable than open.er-api.com"

  # Regional Central Banks
  bank_of_thailand:
    name: "Bank of Thailand API"
    type: "historical"
    coverage: "THB and regional currencies"
    format: "JSON/XML"
    frequency: "Daily"
    history: "Decades of historical data"
    cost: "FREE"
    api_key: "May be required"
    url: "https://www.bot.or.th/"
    thb_specific: true
    holiday_aware: true
    pros:
      - "Authoritative Thai market data"
      - "Holiday-aware data"
      - "Long historical coverage"
      - "Best for Thai holiday gaps"
    cons:
      - "Limited to Thai region"
      - "API may require registration"
      - "Documentation in Thai"

  european_central_bank:
    name: "European Central Bank (ECB)"
    type: "historical"
    coverage: "40+ currencies vs EUR"
    format: "XML/CSV"
    frequency: "Daily"
    history: "1999-present"
    cost: "FREE"
    api_key: "Not required"
    url: "https://www.ecb.europa.eu/"
    pros:
      - "Authoritative European data"
      - "Long historical coverage"
      - "No API key required"
      - "Daily reference rates"
    cons:
      - "EUR base only (requires conversion)"
      - "Limited currency coverage"
      - "European market hours only"

# Commodity Sources
commodity_sources:
  # Primary Energy Sources
  alpha_vantage:
    name: "Alpha Vantage API"
    type: "current_historical"
    coverage: "WTI, BRENT, NATURAL_GAS, COPPER, WHEAT, CORN"
    format: "JSON"
    frequency: "Daily (energy), Monthly (agricultural)"
    history: "20+ years"
    cost: "FREE"
    api_key: "Required (free tier: 25 requests/day)"
    rate_limit: "25 requests/day (free tier)"
    url: "https://www.alphavantage.co/"
    mcp_integration: true
    pros:
      - "Unified API for multiple commodities"
      - "Good historical coverage"
      - "MCP integration available"
      - "Well-documented"
    cons:
      - "Rate limits on free tier"
      - "No precious metals spot prices"
      - "Different frequencies by commodity"

  # Precious Metals Sources
  github_datasets:
    name: "GitHub Historical Datasets"
    type: "historical"
    coverage: "GOLD, SILVER"
    format: "CSV"
    frequency: "Daily"
    history: "2004-present (GOLD), 1968-present (SILVER)"
    cost: "FREE"
    api_key: "Not required"
    url: "https://github.com/datasets/"
    pros:
      - "Long historical coverage"
      - "No rate limits"
      - "Free and open"
      - "Daily data"
    cons:
      - "Manual updates required"
      - "No real-time data"
      - "Limited to GOLD/SILVER"

  minted_metal:
    name: "Minted Metal API"
    type: "validation"
    coverage: "GOLD, SILVER, PLATINUM, PALLADIUM, RHODIUM"
    format: "JSON"
    frequency: "Twice daily (11:00 and 16:00 UTC)"
    history: "Current spot prices"
    cost: "FREE"
    api_key: "Not required"
    url: "https://mintedmetal.com/api/prices.json"
    source: "LBMA benchmark prices"
    pros:
      - "Authoritative LBMA prices"
      - "No API key required"
      - "Good for validation"
      - "CORS enabled"
    cons:
      - "Current prices only"
      - "Twice daily updates"
      - "No historical data"

  metalprices:
    name: "MetalPrices API"
    type: "fallback"
    coverage: "GOLD, SILVER, PLATINUM, PALLADIUM"
    format: "JSON"
    frequency: "Hourly"
    history: "Current spot prices"
    cost: "FREE"
    api_key: "Not required"
    url: "https://api.metalpriceapi.com/v1/"
    pros:
      - "Hourly updates"
      - "No API key required"
      - "Good fallback"
    cons:
      - "Current prices only"
      - "Less authoritative than LBMA"

  goldapi:
    name: "GoldAPI.io"
    type: "specialized"
    coverage: "XAU/THB (Thai Gold)"
    format: "JSON"
    frequency: "Daily"
    history: "Historical available"
    cost: "FREE (100 calls/month)"
    api_key: "Required"
    rate_limit: "100 calls/month (free tier)"
    url: "https://www.goldapi.io/"
    thb_specific: true
    pros:
      - "Specialized for Thai gold"
      - "Historical data available"
      - "XAU/THB specific"
    cons:
      - "Low rate limit on free tier"
      - "Requires API key"
      - "Limited to gold"

# Index Sources
