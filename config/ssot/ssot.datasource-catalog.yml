title: Trade Data Source Catalog
subtitle: Comprehensive catalog of all available data sources for reliability and redundancy
icon: 📊

sections:
  - title: Data Source Policy
    icon: 🎯
    items: data_source_policy
  - title: Exchange Rate Sources
    icon: 💱
    items: exchange_rate_sources
  - title: Commodity Sources
    icon: 📈
    items: commodity_sources
  - title: Index Sources
    icon: 📊
    items: index_sources
  - title: Validation Sources
    icon: ✅
