# Validation Sources
# Sources actually used by data_quality_agent.py and ssot.data.yml for cross-checking.
validation_sources:
  # Precious metals validation
  minted_metal:
    name: "Minted Metal (Primary Validation)"
    type: "precious_metals"
    authority: "LBMA benchmark prices"
    frequency: "Twice daily"
    endpoint: "https://mintedmetal.com/api/prices.json"
    used_by: "data_quality_agent.py"
    pros:
      - "Authoritative source"
      - "No API key required"
      - "Good for validation"

  metalprices:
    name: "MetalPrices (Fallback Validation)"
    type: "precious_metals"
    frequency: "Hourly"
    endpoint: "https://api.metalpriceapi.com/v1/latest"
    used_by: "data_quality_agent.py"
    pros:
      - "Good backup"
      - "No API key required"

  # Exchange-rate validation
  open_exchange_rates_validation:
    name: "open.er-api.com (Validation)"
    type: "exchange_rate"
    endpoint: "https://open.er-api.com/v6/latest/USD"
    used_by: "data_quality_agent.py, manual_update.sh"
    note: "Primary current-spot cross-check for all currencies including THB"

  exchangerate_api_validation:
    name: "exchangerate-api.com (Validation)"
    type: "exchange_rate"
    endpoint: "https://api.exchangerate-api.com/v4/latest/USD"
    used_by: "data_quality_agent.py"
    note: "Fallback current-spot cross-check"

  fred_dxy_validation:
    name: "FRED DXY (Validation)"
    type: "dollar_index"
    endpoint: "https://api.stlouisfed.org/fred/series/observations?series_id=DTWEXBGS"
    used_by: "data_quality_agent.py"
    note: "Requires FRED_API_KEY; FRED DNS issues in containers"

  # Commodity validation
  alpha_vantage_validation:
    name: "Alpha Vantage (Validation)"
    type: "commodity"
    endpoint: "https://www.alphavantage.co/query?function=<WTI|BRENT|COPPER|NATURAL_GAS>"
    used_by: "data_quality_agent.py"
    note: "Uses ALPHA_VANTAGE_API_KEY; DXY via CURRENCY_EXCHANGE_RATE is not supported"

