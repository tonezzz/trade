title: TradeCanvas Compare Page Configuration
subtitle: Page-specific settings for compare.html

family: compare-family
features: []

page:
  id: compare
  html_file: compare.html
  cache_version: 2
  title: "TradeCanvas - Compare"
  layout: default

chart_loader:
  ref: "ssot.ui.compare-family.yml#chart_loader"
  show_volume: false
  enable_controls: false
  enable_markers: false

currency_selector:
  ref: "ssot.ui.compare-family.yml#currency_selector"
  mode: full
  class_name: currency-selector

strategy_panel:
  ref: "ssot.ui.compare-family.yml#strategy_panel"

scripts:
  - chart-loader.js
  - strategies.js
  - hindsight-strategies-new.js
  - strategy-compare-new.js

cache_busting:
  query_param: v
  versions:
    compare_html: 2
    chart_loader: 0

navigation:
  ref: "ssot.ui.yml#navigation"
  active_page: compare
