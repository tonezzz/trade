title: Continuous Improvement Plan
subtitle: Active development initiatives, backlog, and follow-up tracker for the Trade system
status: active

ideas:
  - Central tracker for all ongoing and proposed improvements
  - Links each initiative to its SSOT, documentation, and next actionable step
  - Reviewed and updated at the end of each session

review_cadence:
  - End of every working session: update initiative status and next steps
  - Weekly: re-prioritize backlog and unblock blocked items
  - Monthly: archive completed items into docs/core/DECISION_LOG.md

# Active and planned initiatives
initiatives:
  - id: mcp-tools-policy
    title: MCP Tools SSOT Policy
    status: completed
    priority: high
    description: |
      Consolidate MCP server and tool guidance into a machine-readable SSOT
      to improve discovery, selection logic, and failure handling.
    refs:
      - config/ssot/ssot.index.yml
      - config/ssot/ssot.mcp-tools.yml
      - /home/tony/CascadeProjects/chaba/docs/ssot/infrastructure/ssot.mcp-tools.yml
      - AGENTS.md
    next_steps:
      - Promote the global ssot.mcp-tools.yml status from experimental to active after validation

  - id: ui-state-persistence
    title: UI Selection State Persistence
    status: completed
    priority: high
    description: |
      Make all user selections (currency, timeframe, chart type, etc.) survive
      a page refresh by driving persistence from ssot.ui.state.yml.
    refs:
      - config/ssot/ssot.ui.state.yml
      - tradecanvas-ui/ui-components.js
      - tradecanvas-ui/chart-loader.js
    next_steps:
      - Audit localStorage reads/writes against ssot.ui.state.yml
      - Ensure CurrencySelector and TimeframeSelector render with stored values
      - Fix the "reverts on refresh" issue (ui-bug-002)

  - id: ui-initial-disconnected
    title: Fix Initial "Disconnected" Status on Compare2
    status: completed
    priority: high
    description: |
      The compare2 page shows "Disconnected" on first load until the user
      manually changes a selection. Update load state and status flow.
    refs:
      - config/ssot/ssot.ui.bugs.yml
      - tradecanvas-ui/chart-loader.js
      - tradecanvas-ui/chart-renderer.js
    next_steps:
      - Change initial status from "Disconnected" to "Loading"
      - Ensure updateUI() runs on both API and fallback data
      - Verify with playlive on a fresh session

  - id: ui-week-timeframe-render
    title: Fix 1 Week Timeframe Chart Rendering for GOLD and Others
    status: completed
    priority: high
    description: |
      The 1W timeframe chart is empty or incorrectly rendered for GOLD and
      other symbols. Investigate data density, visible range, and renderer
      handling of very short timeframes.
    refs:
      - config/ssot/ssot.ui.bugs.yml
      - tradecanvas-ui/chart-data-provider.js
      - tradecanvas-ui/chart-renderer.js
    next_steps:
      - Done: verified GOLD 1W renders a single real candle from the tony-dell podman API via tony-omen Caddy proxy

  - id: compare-modularization
    title: Compare / Compare2 Modularization
    status: completed
    priority: high
    description: |
      SSOT-driven modularization of compare and compare2 pages is complete.
      Generic promote-feature.sh workflow works and all compare2 features have
      been promoted to compare-family. Design registry created.
    refs:
      - config/ssot/ssot.ui.feature.template.yml
      - docs/kb/tradecanvas-ui-ssot-workflow.md
      - tradecanvas-ui/ARCHITECTURE.md
      - docs/ssot/ui-compare-family-design.md
    next_steps:
      - Monitor for new compare2 page-specific features to promote

  - id: ssot-streamlining
    title: Streamlined SSOT Structure Across Domains
    status: proposed
    priority: medium
    description: |
      Apply the four-layer SSOT pattern (base, family, page, feature) across
      apps, libraries, APIs, data, and infrastructure.
    refs:
      - config/ssot/ssot.index.yml
      - docs/kb/tradecanvas-ui-ssot-workflow.md
    next_steps:
      - Define naming convention ssot.<domain>.<layer>.<component>.yml
      - Catalog existing SSOT files and identify structural gaps
      - Update ssot.index.yml to reflect new organization

  - id: datasource-reliability
    title: Data Source Reliability and Catalog
    status: in_progress
    priority: high
    description: |
      Maintain and extend ssot.datasource-catalog.yml with active/candidate
      sources and validation results from data_quality_agent.py.
    refs:
      - config/ssot/ssot.datasource-catalog.yml
      - scripts/data_quality_agent.py
    next_steps:
      - Restart Trade API on tony-omen to validate the commodity chart-data endpoint after the stale-code fix
      - Integrate Frankfurter and exchangerate.dev into data pipeline where appropriate
      - Validate THB and commodity data paths
      - Update status fields based on operational observations

  - id: playlive-cdp-persistence
    title: PlayLive CDP Setup Persistence
    status: completed
    priority: medium
    description: |
      Ensure Chrome CDP and playlived remain available across reboots
      on tony-omen, tony-dell, and macbook.
    refs:
      - docs/kb/root-cause-2026-08-15.md
      - /home/tony/.local/playlive/remote-setup.sh
    next_steps:
      - Verify after next reboot
      - Document monitoring procedure

  - id: perfect-strategy
    title: Perfect Strategy Benchmarking
    status: completed
    priority: medium
    description: |
      Perfect strategy auto-detect ran on full THB historical data through
      the compare2 UI. Hindsight-01 and Hindsight-02 produced positive
      returns, validating the auto-detection and comparison pipeline.
    refs:
      - docs/kb/trade-ui-improvements-2026-08-07.md
      - tradecanvas-ui/strategies.js
      - config/ssot/ssot.ui.yml
      - docs/ssot/ui-compare-family-design.md
    next_steps:
      - THB/1Y Hindsight-01: 22.1% return, 9 trades, 100% win
      - THB/1Y Hindsight-02: 33.9% return, 69 trades, 72.5% win
      - Expand to additional symbols and timeframes (GOLD, DXY)

