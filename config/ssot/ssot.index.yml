# Search integration
search_integration:
  ssot_search_skill:
    pattern: "config/ssot/**/*.yml"
    excludes:
      - "template.yml"
    context_lines: 2
  central_ssot:
    path: "/home/tony/CascadeProjects/chaba/docs/ssot/ssot.index.yml"
    cross_reference: true