title: Trade SSOT Index
subtitle: Master index of all Trade system SSOT files — purpose, location, and key content
icon: 📊

ideas:
  - Single entry point for Trade system SSOT configuration
  - Use ssot-search skill to search across all SSOT content (YAML only)
  - Cross-references central SSOT for shared infrastructure
  - Files without subtitles are config-type (flexible structure, no title required)
  - Integration with central SSOT at /home/tony/CascadeProjects/chaba/docs/ssot/ssot.index.yml

sections:
  - title: Core Trade Configuration
    icon: ⚙️
    layout: list
    items:
      - label: ssot.index.yml
        text: This file. Master index of all Trade SSOT files.
        path: config/ssot/ssot.index.yml

      - label: ssot.health.yml
        text: Health check endpoints and monitoring for trade services — API, automation, database
        path: config/ssot/ssot.health.yml

      - label: ssot.infrastructure.yml
        text: Trade system infrastructure — Docker Compose, networks, machines, deployment
        path: config/ssot/ssot.infrastructure.yml

  - title: Data & Data Sources
    icon: 📈
    layout: list
    items:
      - label: ssot.data.yml
        text: Data source configuration — APIs, download URLs, scheduling, validation
        path: config/ssot/ssot.data.yml

      - label: ssot.datasource-catalog.yml
        text: Comprehensive catalog of all available data sources for reliability and redundancy
        path: config/ssot/ssot.datasource-catalog.yml

      - label: ssot.api.yml
        text: API configuration — endpoints, authentication, rate limiting, CORS
        path: config/ssot/ssot.api.yml

  - title: Trading Features
    icon: 📉
    layout: list
    items:
      - label: ssot.signals.yml
        text: Trading signals configuration — strategies, parameters, thresholds
        path: config/ssot/ssot.signals.yml

      - label: ssot.backtesting.yml
        text: Backtesting configuration — strategies, parameters, execution settings
        path: config/ssot/ssot.backtesting.yml

  - title: UI & Frontend
    icon: 🎨
    layout: list
    items:
      - label: ssot.ui.yml
        text: TradeCanvas UI base configuration — colors, symbols, APIs, strategy panel defaults
        path: config/ssot/ssot.ui.yml

      - label: ssot.ui.compare-family.yml
        text: TradeCanvas Compare family configuration — shared settings for compare and compare2
        path: config/ssot/ssot.ui.compare-family.yml

      - label: ssot.ui.compare.yml
        text: TradeCanvas Compare page-specific configuration — chart, currency selector, scripts
        path: config/ssot/ssot.ui.compare.yml

      - label: ssot.ui.compare2.yml
        text: TradeCanvas Compare2 page-specific configuration — layout, chart, strategy panel
        path: config/ssot/ssot.ui.compare2.yml

      - label: ssot.ui.feature.template.yml
        text: Feature SSOT template for preview on compare2 and promotion to compare/family
        path: config/ssot/ssot.ui.feature.template.yml

      - label: ssot.feature.template.yml
        text: Generic feature SSOT template for any domain or app
        path: config/ssot/ssot.feature.template.yml

      - label: ssot.ui.feature.chart-controls.yml
        text: Chart controls feature — volume, controls, and markers for the compare family
        path: config/ssot/ssot.ui.feature.chart-controls.yml

      - label: ssot.ui.feature.currency-selector-compact.yml
        text: Compact currency selector feature for the compare family
        path: config/ssot/ssot.ui.feature.currency-selector-compact.yml

      - label: ssot.playlive-tests.yml
        text: Central PlayLive test catalog across UIs, APIs, data imports, and health
        path: config/ssot/ssot.playlive-tests.yml

      - label: ssot.ui.playlive-tests.yml
        text: PlayLive browser test cases for TradeCanvas components
        path: config/ssot/ssot.ui.playlive-tests.yml

      - label: ssot.api.playlive-tests.yml
        text: PlayLive test cases for Trade API endpoints
        path: config/ssot/ssot.api.playlive-tests.yml

      - label: ssot.ui.state.yml
        text: Persisted UI state schema — localStorage keys and default values for currency, timeframe, etc.
        path: config/ssot/ssot.ui.state.yml

      - label: ssot.ui.bugs.yml
        text: TradeCanvas UI bug tracker — symptoms, repro steps, and next actions
        path: config/ssot/ssot.ui.bugs.yml

  - title: Planning and Improvement
    layout: list
    items:
      - label: ssot.continuous-improvement.yml
        text: Active development initiatives, backlog, and follow-up tracker
        path: config/ssot/ssot.continuous-improvement.yml

      - label: ssot.mcp-tools.yml
        text: MCP tools policy — local reference to the global chaba SSOT
        path: config/ssot/ssot.mcp-tools.yml

  - title: Cross-References
    icon: 🔗
    layout: list
    items:
      - label: Central SSOT Index
        text: Master SSOT index for all projects — infrastructure, services, apps
        path: /home/tony/CascadeProjects/chaba/docs/ssot/ssot.index.yml

      - label: Central Health SSOT
        text: Health check configuration for shared services (PostgreSQL, GPU, etc.)
        path: /home/tony/CascadeProjects/chaba/docs/ssot/infrastructure/ssot.health.yml

      - label: Central Infrastructure SSOT
        text: Shared infrastructure configuration — networks, machines, services
        path: /home/tony/CascadeProjects/chaba/docs/ssot/infrastructure/ssot.services.yml

