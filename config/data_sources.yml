# Data Sources Configuration for Automated Download and Import
# This file defines all data sources, their download URLs, and scheduling information
#
# ACTUAL DATA SOURCE USAGE (as of 2026-08-06):
# ================================================
# EXCHANGE RATES:
# - USD/THB: open.er-api.com (real-time, reliable for THB)
# - Other currencies: exchangerate-api.com (primary), FRED API (secondary)
# - Alpha Vantage: NOT used for exchange rates (limited THB support)
#
# COMMODITIES:
# - WHEAT, CORN, WTI, BRENT, NATURAL_GAS, COPPER: Alpha Vantage API (correct function names)
# - XAU (Gold), XAG (Silver): MetalPrices API (Alpha Vantage doesn't provide spot prices)
#
# DOLLAR INDEX (DXY):
# - FRED API (DTWEXBGS series) - Alpha Vantage doesn't support DXY
#
# VALIDATION SOURCES:
# - Data quality agent uses multiple external sources for validation
# - Alpha Vantage MCP integration for commodity price validation
# - MetalPrices API for precious metals validation

# Global settings
settings:
  # Directory for downloaded data files
  download_dir: "data/archive"
  # Directory for formatted/import-ready data files
  import_dir: "data/imported"
  # Number of retry attempts for failed downloads
  max_retries: 3
  # Initial retry delay in seconds (will use exponential backoff)
  retry_delay: 5
  # Enable/disable dry run mode (no actual downloads/imports)
  dry_run: false
  # Log file path for automation logs
  log_file: "logs/automation.log"
  # Enable email notifications on errors
  enable_notifications: false
  # Notification email (if enabled)
  notification_email: ""
  # Skip validation errors (continue import despite validation failures)
  skip_validation: true
  
  # Data quality settings
  data_quality:
    enabled: true
    tolerance_pct: 2.0
    max_freshness_days: 2
    min_completeness_pct: 90.0
    alert_threshold: 3
    run_after_import: true
    schedule: "daily"
    schedule_time: "18:00"
    history_days: 30
  
  # Data quality settings
  min_data_points: 1000  # Minimum data points for valid import
  max_gap_days: 7       # Maximum allowed gap in days
  require_ohlc: false    # Whether OHLC data is required
  
  # API rate limiting
  rate_limit_requests: 10
  rate_limit_period: 60  # seconds
  
  # Data validation
  validate_price_ranges: true
  validate_date_sequences: true

# Data source categories
categories:
  currencies:
    description: "Major currency pairs vs USD"
    priority: "high"
  commodities:
    description: "Precious metals, energy, and agricultural commodities"
    priority: "medium"
  indices:
    description: "Market indices and benchmarks"
    priority: "high"

# Data sources configuration
data_sources:
  # WTI Crude Oil Data
  wti_oil:
    name: "WTI Crude Oil"
    description: "West Texas Intermediate crude oil daily prices"
    type: "commodity"
    symbol: "WTI"
    commodity: "OIL"
    unit: "barrel"
    # Download URL for raw data
    url: "https://raw.githubusercontent.com/datasets/oil-prices/main/data/wti-daily.csv"
    # Schedule: daily at 6:00 AM
    schedule: "daily"
    schedule_time: "06:00"
    # Import function to use
    import_function: "import_commodity_prices"
    # Data source identifier for database
    source: "automated_wti"
    # Enable/disable this source
    enabled: false  # Disabled due to data quality issues
    # Custom formatter function (optional)
    formatter: "format_wti_data"

  # Brent Crude Oil Data
  brent_oil:
    name: "Brent Crude Oil"
    description: "Brent crude oil daily prices"
    type: "commodity"
    symbol: "BRENT"
    commodity: "OIL"
    unit: "barrel"
    # Download URL for raw data
    url: "https://raw.githubusercontent.com/datasets/oil-prices/main/data/brent-daily.csv"
    # Schedule: daily at 6:00 AM
    schedule: "daily"
    schedule_time: "06:00"
    # Import function to use
    import_function: "import_commodity_prices"
    # Data source identifier for database
    source: "automated_brent"
    # Enable/disable this source
    enabled: false  # Disabled due to data quality issues
    # Custom formatter function (optional)
    formatter: "format_brent_data"

  # ECB Exchange Rates
  ecb_exchange_rates:
    name: "ECB Exchange Rates"
    description: "European Central Bank daily reference exchange rates"
    type: "exchange_rate"
    # Download URL for ECB data
    url: "https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml"
    # Schedule: daily at 5:00 PM (after ECB release)
    schedule: "daily"
    schedule_time: "17:00"
    # Import function to use
    import_function: "import_exchange_rates"
    # Data source identifier for database
    source: "automated_ecb"
    # Enable/disable this source
    enabled: false  # Disabled due to limited currency coverage
    # Custom formatter function (optional)
    formatter: "format_ecb_data"
    # Base currency for ECB data
    base_currency: "EUR"

  # Japanese Yen
  jpy_exchange_rates:
    name: "USD/JPY Exchange Rates"
    description: "USD to Japanese Yen daily exchange rates"
    type: "exchange_rate"
    symbol: "JPY"
    quote_currency: "JPY"
